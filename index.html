<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NSO Talent & Senjutsu Skill Tree Viewer by Uruzua</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#1d1a16;color:#f3e9d2;font:15px/1.5 system-ui,sans-serif}
body.sheet{padding-bottom:45vh}
header{display:flex;gap:6px;padding:14px 18px 0;background:#2a251e;border-bottom:2px solid #c98a1b;overflow-x:auto}
.tab{padding:8px 22px;border:0;border-radius:8px 8px 0 0;background:#3a3329;color:#cdbf9f;font:inherit;cursor:pointer}
.tab.on{background:#e8a92b;color:#2a1c05;font-weight:600}
main{display:grid;grid-template-columns:230px minmax(280px,440px) 1fr;gap:16px;padding:16px;max-width:1100px;margin:auto;align-items:start}
#side{position:sticky;top:12px}
#sbox{display:flex;flex-direction:column;gap:8px}
#q{width:100%;padding:9px 11px;border-radius:8px;border:2px solid #4a4032;background:#2f2920;color:inherit;font:inherit}
#list{display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 140px);overflow-y:auto}
.item,#pick{display:flex;align-items:center;gap:10px;padding:8px;border:2px solid #4a4032;border-radius:10px;background:#2f2920;color:inherit;font:inherit;text-align:left;cursor:pointer;width:100%}
.item:hover{border-color:#c98a1b}
.item.on{background:#f1dc7a;color:#2a1c05;border-color:#e8a92b}
.item img,#pick img{width:48px;height:48px;border-radius:6px}
#pick{display:none;justify-content:space-between}
#pick span{flex:1}
.none{padding:14px;color:#cdbf9f}
#stage{position:relative;background:#fbf5a9;border:3px solid #c98a1b;border-radius:12px}
#stage>img{display:block;width:100%}
.hot{position:absolute;width:24%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:8px;cursor:pointer}
.hot:hover,.hot.sel{outline:3px solid #e8441a}
#tip{position:fixed;display:none;max-width:290px;padding:9px 11px;background:#fff;color:#111;border:1px solid #222;font-size:13px;line-height:1.4;pointer-events:none;z-index:9}
#sheet{position:fixed;left:0;right:0;bottom:0;display:none;max-height:45vh;overflow:auto;padding:14px 16px 22px;background:#fff;color:#111;border-top:3px solid #c98a1b;box-shadow:0 -4px 16px rgba(0,0,0,.4);z-index:10;font-size:15px;line-height:1.45}
.st{margin-top:6px;display:flex;gap:14px;flex-wrap:wrap;font-weight:700}
.d{color:#e0222d}.c{color:#2f7bff}.k{color:#d98200}.sub{color:#555}
.panel{background:#f7e9b5;color:#3a2a0c;border:3px solid #c98a1b;border-radius:12px;padding:16px}
.panel h2{margin:0 0 8px}
.empty{padding:40px;text-align:center;color:#cdbf9f;grid-column:1/-1}
@media(max-width:800px){main{grid-template-columns:1fr}#side{position:static}#pick{display:flex}#sbox{display:none;margin-top:8px}#side.open #sbox{display:flex}#list{max-height:55vh}}
</style></head><body>
<header id="tabs"></header>
<main id="main"></main>
<div id="tip"></div><div id="sheet"></div>
<script src="data.js"></script>
<script>
const NAMES={extreme:'Extreme',secret:'Secret',senjutsu:'Senjutsu'};
const touch=matchMedia('(hover: none)').matches;
let tab='extreme',cur=0,q='';
const $=id=>document.getElementById(id),tip=$('tip'),sheet=$('sheet');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const info=s=>'<b>'+esc(s.name)+'</b> <span class="sub">(Skill)</span><div>'+esc(s.desc)+'</div><div class="st"><span class="d">Damage: '+esc(s.damage)+'</span><span class="c">CP: '+esc(s.cp)+'</span><span class="k">CD: '+esc(s.cd)+'</span></div>';
function hideSheet(){sheet.style.display='none';document.body.classList.remove('sheet');document.querySelectorAll('.hot.sel').forEach(h=>h.classList.remove('sel'))}
function renderList(){
  const list=TABS[tab],box=$('list'),k=q.trim().toLowerCase();box.innerHTML='';let n=0;
  list.forEach((x,i)=>{
    if(k&&!x.name.toLowerCase().includes(k)&&!x.skills.some(s=>s.name.toLowerCase().includes(k)))return;
    n++;const b=document.createElement('button');b.className='item'+(i===cur?' on':'');
    b.innerHTML='<img src="'+x.thumb+'" alt=""><span>'+esc(x.name)+'</span>';
    b.onclick=()=>{cur=i;render()};box.appendChild(b)});
  if(!n)box.innerHTML='<div class="none">No match.</div>';
}
function render(){
  hideSheet();$('tabs').innerHTML='';
  Object.keys(NAMES).forEach(k=>{const b=document.createElement('button');b.className='tab'+(k===tab?' on':'');b.textContent=NAMES[k];b.onclick=()=>{tab=k;cur=0;q='';render()};$('tabs').appendChild(b)});
  const list=TABS[tab]||[],m=$('main');
  if(!list.length){m.innerHTML='<div class="empty">No talents added to this tab yet.</div>';return}
  const t=list[cur];
  m.innerHTML='<div id="side"><button id="pick"><img src="'+t.thumb+'" alt=""><span>'+esc(t.name)+'</span>\u25BE</button><div id="sbox"><input id="q" type="search" placeholder="Search talent or skill..."><div id="list"></div></div></div><div id="stage"><img src="'+t.image+'" alt="'+esc(t.name)+'"></div><div class="panel"><h2>'+esc(t.name)+'</h2><p>'+esc(t.desc)+'</p><p style="font-size:13px;opacity:.75">'+(touch?'Tap':'Hover')+' a skill icon to see its details.</p></div>';
  $('q').value=q;$('q').oninput=e=>{q=e.target.value;renderList()};
  $('pick').onclick=()=>$('side').classList.toggle('open');
  renderList();
  t.skills.forEach(s=>{
    const h=document.createElement('div');h.className='hot';h.style.left=s.x+'%';h.style.top=s.y+'%';
    if(touch){h.onclick=()=>{hideSheet();h.classList.add('sel');sheet.innerHTML=info(s);sheet.style.display='block';document.body.classList.add('sheet')}}
    else{
      h.onmouseenter=()=>{tip.innerHTML=info(s);tip.style.display='block'};
      h.onmousemove=e=>{let x=e.clientX+16,y=e.clientY+16;if(x>innerWidth-tip.offsetWidth-8)x=e.clientX-tip.offsetWidth-16;if(y>innerHeight-tip.offsetHeight-8)y=e.clientY-tip.offsetHeight-16;tip.style.left=x+'px';tip.style.top=y+'px'};
      h.onmouseleave=()=>tip.style.display='none';
    }
    $('stage').appendChild(h);
  });
}
document.addEventListener('click',e=>{if(!e.target.closest('.hot')&&!e.target.closest('#sheet'))hideSheet()});
render();
</script></body></html>
