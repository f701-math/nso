<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skill Tree Viewer</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#1d1a16;color:#f3e9d2;font:15px/1.5 system-ui,sans-serif}
header{display:flex;gap:6px;padding:14px 18px 0;background:#2a251e;border-bottom:2px solid #c98a1b}
.tab{padding:8px 22px;border:0;border-radius:8px 8px 0 0;background:#3a3329;color:#cdbf9f;font:inherit;cursor:pointer}
.tab.on{background:#e8a92b;color:#2a1c05;font-weight:600}
main{display:grid;grid-template-columns:230px minmax(280px,440px) 1fr;gap:16px;padding:16px;max-width:1100px;margin:auto;align-items:start}
#list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;padding:8px;border:2px solid #4a4032;border-radius:10px;background:#2f2920;color:inherit;font:inherit;text-align:left;cursor:pointer}
.item:hover{border-color:#c98a1b}
.item.on{background:#f1dc7a;color:#2a1c05;border-color:#e8a92b}
.item img{width:48px;height:48px;border-radius:6px}
#stage{position:relative;background:#fbf5a9;border:3px solid #c98a1b;border-radius:12px}
#stage>img{display:block;width:100%}
.hot{position:absolute;width:24%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:8px;cursor:pointer}
.hot:hover{outline:3px solid #e8441a}
#tip{position:fixed;display:none;max-width:290px;padding:9px 11px;background:#fff;color:#111;border:1px solid #222;font-size:13px;line-height:1.4;pointer-events:none;z-index:9}
#tip b{font-size:14px}#tip .s{color:#555}
#tip .st{margin-top:5px;display:flex;gap:10px;font-weight:600}
.panel{background:#f7e9b5;color:#3a2a0c;border:3px solid #c98a1b;border-radius:12px;padding:16px}
.panel h2{margin:0 0 8px}
.empty{padding:40px;text-align:center;color:#cdbf9f;grid-column:1/-1}
@media(max-width:800px){main{grid-template-columns:1fr}#list{flex-direction:row;overflow-x:auto}}
</style></head><body>
<header id="tabs"></header>
<main id="main"></main>
<div id="tip"></div>
<script src="data.js"></script>
<script>
const NAMES={extreme:'Extreme',secret:'Secret',senjutsu:'Senjutsu'};
let tab='extreme',cur=0;
const $=id=>document.getElementById(id),tip=$('tip');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(){
  $('tabs').innerHTML='';
  Object.keys(NAMES).forEach(k=>{const b=document.createElement('button');b.className='tab'+(k===tab?' on':'');b.textContent=NAMES[k];b.onclick=()=>{tab=k;cur=0;render()};$('tabs').appendChild(b)});
  const list=TABS[tab]||[],m=$('main');
  if(!list.length){m.innerHTML='<div class="empty">No talents added to this tab yet.</div>';return}
  const t=list[cur];
  m.innerHTML='<div id="list"></div><div id="stage"><img src="'+t.image+'" alt="'+esc(t.name)+'"></div><div class="panel"><h2>'+esc(t.name)+'</h2><p>'+esc(t.desc)+'</p><p style="font-size:13px;opacity:.75">Hover a skill icon to see its details.</p></div>';
  list.forEach((x,i)=>{const b=document.createElement('button');b.className='item'+(i===cur?' on':'');b.innerHTML='<img src="'+x.thumb+'" alt=""><span>'+esc(x.name)+'</span>';b.onclick=()=>{cur=i;render()};$('list').appendChild(b)});
  t.skills.forEach(s=>{
    const h=document.createElement('div');h.className='hot';h.style.left=s.x+'%';h.style.top=s.y+'%';
    h.onmouseenter=()=>{tip.innerHTML='<b>'+esc(s.name)+'</b> <span class="s">(Skill)</span><div>'+esc(s.desc)+'</div><div class="st"><span>Damage: '+esc(s.damage)+'</span><span>CP: '+esc(s.cp)+'</span><span>CD: '+esc(s.cd)+'</span></div>';tip.style.display='block'};
    h.onmousemove=e=>{let x=e.clientX+16,y=e.clientY+16;if(x>innerWidth-tip.offsetWidth-8)x=e.clientX-tip.offsetWidth-16;if(y>innerHeight-tip.offsetHeight-8)y=e.clientY-tip.offsetHeight-16;tip.style.left=x+'px';tip.style.top=y+'px'};
    h.onmouseleave=()=>tip.style.display='none';
    $('stage').appendChild(h);
  });
}
render();
</script></body></html>
